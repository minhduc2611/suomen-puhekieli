# Netlify deploys the static `dist/` folder. Nothing runs server-side, and no audio
# is shipped: the app speaks with the device's own Finnish voice.
#
# To serve the pre-generated MP3s instead, run `npm run audio` locally and upload the
# built folder yourself (`npm run deploy`) — ~280 MB, so it does not belong in git or
# in a build that runs on every push.
[build]
  command = "npm run content && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /api/tts generates a clip on demand, so no audio has to be deployed. The path is
# declared by the function itself (`export const config`).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Only relevant when an MP3 pack is uploaded: a clip's filename is the hash of the
# Finnish text it speaks, so a given file never changes. Cache it for a year.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed JS/CSS filenames change on every content change, so they are immutable too.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and the content it precaches must always be revalidated, or an
# installed copy can never learn that a new version exists.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
